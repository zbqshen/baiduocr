[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baiduocr"
version = "0.1.0"
description = "Standalone Baidu OCR CLI and Hermes-friendly workflow"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "OpenAI Codex via Hermes"}
]
dependencies = [
  "requests>=2.31.0",
  "Pillow>=10.0.0"
]
keywords = ["baidu", "ocr", "hermes", "windows", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License"
]

[project.scripts]
baiduocr = "baiduocr.cli:main"
baiduocr-doc-parse = "baiduocr.doc_parser:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
